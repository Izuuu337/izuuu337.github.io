<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile AI Voice App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin: 15px 0;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #aaa;
        }
        audio {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Text-to-Speech</h2>
    <textarea id="textInput" placeholder="Type your text here..."></textarea>
    <button id="speakBtn" onclick="generateSpeech()">Speak Text</button>
    <audio id="audioPlayer" controls style="display:none;"></audio>
</div>

<script>
    // REPLACE WITH YOUR ACTUAL HUGGING FACE API TOKEN
    const API_TOKEN = "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"; 
    const MODEL_ID = "facebook/mms-tts-eng";

    async function generateSpeech() {
        const textInput = document.getElementById('textInput').value;
        const speakBtn = document.getElementById('speakBtn');
        const audioPlayer = document.getElementById('audioPlayer');

        if (!textInput.trim()) {
            alert("Please enter some text!");
            return;
        }

        speakBtn.disabled = true;
        speakBtn.innerText = "Generating AI Voice...";

        try {
            const response = await fetch(`https://huggingface.co{MODEL_ID}`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ inputs: textInput })
            });

            if (!response.ok) {
                throw new Error("API error or model is loading. Try again in a moment.");
            }

            // Convert raw binary data response into a playable audio link
            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            
            audioPlayer.src = audioUrl;
            audioPlayer.style.display = "block";
            audioPlayer.play();

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            speakBtn.disabled = false;
            speakBtn.innerText = "Speak Text";
        }
    }
</script>

</body>
</html>
